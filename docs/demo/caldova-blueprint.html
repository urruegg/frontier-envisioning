<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="generator" content="Frontier Envisioning plugin">
<title>Caldova Industrial AG · Frontier Company Blueprint</title>
<style>
:root{
  color-scheme: light;
  --accent:#0F6CBD; --accent-on:#FFFFFF; --accent-text:#0F5AA6; --accent-soft:#EAF2FB; --accent-line:#B5D0EE;
  --ink:#1B1B1B; --ink-2:#424242; --muted:#616161; --grey:#8A8A8A; --line:#CFCFCF; --line-soft:#E4E4E4;
  --bg:#FFFFFF; --panel:#FFFFFF; --chip:#F4F4F4; --chip-2:#EAEAEA; --band:#F0F0F0;
  --domain:#0F6CBD; --domain-on:#FFFFFF; --domain-soft:#EAF2FB; --focus:#0B5CAD;
  --ok:#107C41; --ok-soft:#E6F4EC; --warn:#A35200; --warn-soft:#FFF2E0; --bad:#A4262C; --bad-soft:#FBEAEA;
  --sans: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark;
    --accent-text:#7FB4EC; --accent-soft:#18283A; --accent-line:#2E4D70;
    --ink:#F2F2F2; --ink-2:#D4D4D4; --muted:#ADADAD; --grey:#8C8C8C; --line:#474747; --line-soft:#333333;
    --bg:#151515; --panel:#1E1E1E; --chip:#272727; --chip-2:#303030; --band:#232323; --domain-soft:#1F2733;
    --ok:#5EC48A; --ok-soft:#173022; --warn:#F0A54A; --warn-soft:#33260F; --bad:#F08A8F; --bad-soft:#3A1C1E;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font-family:inherit;font-size:inherit;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#view:focus{outline:none}
.hidden{display:none !important}
.skip{position:absolute;inset-inline-start:-9999px;inset-block-start:0;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:100}
.skip:focus{inset-inline-start:8px}

/* rail */
.rail{position:fixed;inset-block:0;inset-inline-start:0;width:88px;z-index:20;background:var(--panel);border-inline-end:1px solid var(--line-soft);display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;overflow-y:auto}
.rail .grp{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;text-align:center;line-height:1.2}
.rail .grp:first-child{margin-block-start:0}
.rail button{all:unset;cursor:pointer;width:74px;min-height:50px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-2);text-align:center}
.rail button span{font-size:10.5px;line-height:1.15}
.rail button:hover{background:var(--chip)}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.rail button:focus-visible{outline:2px solid var(--focus)}
.rail svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* page + header */
.page{max-width:1320px;margin:0 auto;padding-block:0 40px;padding-inline:116px 28px}
header.top{display:flex;align-items:center;gap:18px;padding:18px 0 14px;border-block-end:1px solid var(--line-soft)}
.logo{width:56px;height:56px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-on);font-weight:700;font-size:20px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.vdiv{width:1px;align-self:stretch;background:var(--line)}
.ttl .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text)}
.ttl h1{margin:2px 0;font-size:25px;font-weight:700;letter-spacing:-.01em}
.ttl p{margin:0;color:var(--muted);font-size:12.5px}
.cobrand{margin-inline-start:auto;text-align:end;color:var(--muted);font-size:11.5px;line-height:1.4}
.cobrand b{display:block;color:var(--ink-2);font-size:12px}
.banner{margin:12px 0 0;padding:9px 14px;border:1px dashed var(--accent-line);background:var(--accent-soft);border-radius:6px;font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--accent-text)}
.banner.validated{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.crumb{display:flex;gap:8px;align-items:center;margin:14px 0 0;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.crumb b{color:var(--ink-2)}
.subnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 10px}
.subnav:empty{display:none}
.subnav .lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-inline-end:4px}
.tab{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:12.5px}
.tab .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;flex:none}
.tab[aria-selected="true"],.tab[aria-pressed="true"]{background:var(--d);border-color:var(--d);color:var(--d-on)}
/* Number badges keep their own opaque, validated fill and foreground. */
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* generic */
h2.sec{font-size:23px;margin:18px 0 4px;font-weight:700;letter-spacing:-.01em}
h2.sec::after{content:"";display:block;width:44px;height:3px;background:var(--accent);margin-block-start:8px}
p.lead{color:var(--ink-2);margin:8px 0 14px;max-width:920px}
h3.sub{font-size:15px;margin:22px 0 8px}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:12px 14px}
.ptitle{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-block-end:8px}
.ptitle b{font-size:14px}
.ptitle span{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--chip-2);color:var(--ink-2);white-space:nowrap;line-height:1.5}
.pill.d{background:var(--domain-soft);color:var(--ink)}
.pill.acc{background:var(--accent);color:var(--accent-on)}
.pill.hyp{background:transparent;border:1px dashed var(--grey);color:var(--muted)}
.pill.val{background:var(--ok-soft);color:var(--ok)}
.pill.adj{background:var(--warn-soft);color:var(--warn)}
.pill.rej{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.pill.open{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.ev{background:var(--chip);color:var(--ink-2);border:1px solid var(--line-soft);cursor:pointer;font-weight:600;min-width:24px;min-height:24px}
.pill.ev:hover{border-color:var(--accent)}
.pill.int{background:var(--bad-soft);color:var(--bad)}
.small-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:10px 0 4px}
.note{color:var(--muted);font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tbc{color:var(--muted);font-style:italic}
ul.clean{margin:0;padding-inline-start:18px}
ul.clean li{margin:2px 0}
table.t{width:100%;border-collapse:collapse;background:var(--panel)}
table.t th,table.t td{text-align:start;vertical-align:top;padding:8px 10px;border-block-end:1px solid var(--line-soft);font-size:12.5px}
table.t thead th{background:var(--ink);color:var(--bg);font-weight:700;border:0}
table.t tbody th{font-weight:700;width:22%}
.tscroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:6px}
/* Ontology uses text nodes and local scroll regions, including at 320px. */
.preview-notice,.ontology-warning{border:2px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:12px;margin-block:14px}
.preview-notice p{margin:0 0 8px}
.owrap{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:6px}
.osvg{display:block;max-width:none}
.oedge{stroke:var(--grey);stroke-width:1.5;fill:none}
.onode{cursor:pointer}
.onode rect{fill:var(--panel);stroke:var(--ink-2);stroke-width:1.5}
.onode rect.unbound{stroke-dasharray:4 3}
.onode text{fill:var(--ink);font-size:12px;font-weight:700;pointer-events:none}
.onode .osub{fill:var(--muted);font-size:10px;font-weight:400}
.onode.sel rect{fill:var(--accent-soft);stroke:var(--accent-text);stroke-width:3}
.onode:focus-visible{outline:none}
.onode:focus-visible rect{stroke:var(--focus);stroke-width:4}
.ontology-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:12px}
.ontology-cards > *, .ont-fields, .ont-fields dd, .opanel{min-width:0;overflow-wrap:anywhere}
.ont-fields{margin:8px 0}
.ont-fields dt{font-weight:700;color:var(--ink-2);margin-top:5px}
.ont-fields dd{margin-inline:12px 0;white-space:pre-wrap}
.ont-fields .clean{padding-inline-start:16px}
.olayers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-block:12px}
.mapping-gap{color:var(--warn);font-weight:700}
@media(max-width:700px){.olayers{grid-template-columns:minmax(0,1fr)}}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:12.5px}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.status{font-size:12px;color:var(--ok)}

/* overview */
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-block-start:14px}
.hero .mission{background:var(--accent-soft);border-inline-start:4px solid var(--accent);padding:14px 16px;border-radius:4px}
.hero .mission q{display:block;font-size:17px;line-height:1.45;font-style:italic;color:var(--ink)}
.hero .mission .who{margin-block-start:8px;color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-size:24px;color:var(--accent-text);line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:8px 0 4px;border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.ladder .rung{padding:10px 12px;background:var(--panel);border-inline-end:1px solid var(--line-soft);position:relative}
.ladder .rung:last-child{border-inline-end:0}
.ladder .rung .n{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ladder .rung b{display:block;font-size:13.5px;margin:2px 0}
.ladder .rung span:not(.pill){font-size:12px;color:var(--ink-2)}
.ladder .rung.now{background:var(--chip)}
.ladder .rung.target{background:var(--accent-soft)}
.ladder .tag{position:absolute;inset-block-start:8px;inset-inline-end:8px}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dcard{all:unset;cursor:pointer;display:block;background:var(--panel);border:1px solid var(--line-soft);border-block-start:4px solid var(--d);border-radius:6px;padding:12px 14px}
.dcard:hover{box-shadow:var(--shadow)}
.dcard:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dcard b{display:block;font-size:14px}
.dcard .j{font-size:12px;color:var(--ink);font-weight:700;margin:2px 0 6px}
.dcard p{margin:0;font-size:12px;color:var(--ink-2)}
.dcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-block-start:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12px;color:var(--ink-2)}
.legend .it{display:inline-flex;gap:6px;align-items:center}

/* blueprint */
.outcomes{display:grid;grid-template-columns:200px repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:stretch;background:var(--band);border-radius:6px;padding:12px;margin:12px 0}
.outcomes .o{background:var(--panel);border-radius:4px;padding:8px 10px;border-block-start:3px solid var(--domain)}
.outcomes .o b{display:block;font-size:13px}
.outcomes .o span{font-size:11.5px;color:var(--muted)}
.outcomes .measure{grid-column:1 / -1;font-size:12px;color:var(--ink-2)}
.hybrid{border:1px solid var(--line-soft);border-radius:6px;padding:12px;margin:12px 0;background:var(--panel)}
.hybrid-grid{display:grid;grid-template-columns:260px 1fr;gap:12px}
.human{background:var(--chip);border-radius:6px;padding:10px 12px}
.human h3,.agentop h3{margin:0 0 8px;font-size:14px}
.hitem{background:var(--panel);border-radius:4px;padding:7px 9px;margin-block-end:6px}
.hitem b{display:block;font-size:12.5px}
.hitem span{font-size:12px;color:var(--ink-2)}
.agentop{border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px}
.others{display:flex;flex-wrap:wrap;gap:8px;margin-block-end:10px}
.other{all:unset;cursor:pointer;border:1px dashed var(--line);border-radius:6px;padding:6px 10px;font-size:11.5px;max-width:240px}
.other b{display:block;font-size:12px}
.other span{color:var(--muted)}
.other:hover{border-color:var(--accent)}
.team-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:center;margin:8px 0 6px}
.leadcard{all:unset;cursor:pointer;display:block;margin:0 auto;max-width:440px;border:2px solid var(--domain);border-radius:8px;padding:10px 14px;text-align:center;background:var(--domain-soft)}
.leadcard b{display:block;font-size:14px}
.leadcard span{display:block;font-size:12px;color:var(--ink-2)}
.leadcard .mpg{display:flex;gap:6px;justify-content:center;margin-block-start:6px}
.leadcard:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.connector{width:2px;height:14px;background:var(--line);margin:0 auto}
.agents{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:8px;border-block-start:2px solid var(--line);padding-block-start:10px}
.agent{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.agent:hover{box-shadow:var(--shadow)}
.agent:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.agent b{font-size:12.5px}
.agent .cap{font-size:11.5px;color:var(--ink-2)}
.agent .tags{display:flex;flex-wrap:wrap;gap:4px;margin-block-start:auto}
.agent.mvp{border:2px solid var(--accent)}
.agent.hypo{border-style:dashed}
.dataagent{margin-block-start:10px;background:var(--chip);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.dchip{background:var(--panel);border:1px solid var(--line-soft);border-radius:999px;padding:2px 9px;font-size:11.5px}
.seam{margin-block-start:10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:6px;padding:8px 12px;font-size:12.5px}
.row3{display:grid;grid-template-columns:1fr 34px 1.5fr 34px 1fr;gap:8px;margin:12px 0;align-items:stretch}
.arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.arrow i{font-style:normal;font-size:18px;color:var(--grey)}
.li{padding:6px 0;border-block-end:1px solid var(--line-soft)}
.li:last-child{border-block-end:0}
.li b{display:block;font-size:12.5px}
.li span{font-size:12px;color:var(--ink-2)}
.lifecycle{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.lifecycle .st{border:1px solid var(--line);border-radius:4px;padding:4px 8px;font-size:11.5px;background:var(--panel)}
.lifecycle .st.active{border-color:var(--accent);color:var(--accent-text);font-weight:700}
.lifecycle .ar{color:var(--grey)}
.filechips{display:flex;flex-wrap:wrap;gap:6px}
.filechips span{background:var(--chip);border-radius:4px;padding:3px 8px;font-size:11.5px}
.runs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.runs div{background:var(--chip);border-radius:4px;padding:6px 8px}
.runs b{display:block;font-size:12px}
.runs span{font-size:11.5px;color:var(--muted)}
.row4{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;margin:12px 0}
.kbox{background:var(--chip);border-radius:4px;padding:6px 9px;margin-block-end:6px}
.kbox b{display:block;font-size:12.5px}
.kbox span{font-size:12px;color:var(--ink-2)}
.kbox.ext{background:var(--panel);border:1px dashed var(--line)}
.kprinciple{font-size:12px;margin-block-start:6px;color:var(--ink-2)}
.chgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.chgrid div{background:var(--chip);border-radius:4px;padding:5px 8px;font-size:12px}
.build div:not(.ptitle){background:var(--chip);border-radius:4px;padding:6px 9px;margin-block-end:6px;font-size:12.5px;font-weight:700}
.foundation{display:grid;grid-template-columns:200px repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--band);border-radius:6px;padding:12px;margin:12px 0}
.foundation .f{background:var(--panel);border-radius:4px;padding:8px 10px}
.foundation .f b{display:block;font-size:12.5px}
.foundation .f span{font-size:11.5px;color:var(--muted)}

/* org model */
.orgwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.orgsvg{width:100%;height:auto;max-height:860px;display:block;background:var(--panel);border:1px solid var(--line-soft);border-radius:8px}
.orgsvg text{font-family:var(--sans);fill:var(--ink)}
.orgsvg .lbl{font-size:12px;fill:var(--ink-2)}
.orgsvg .lbl-s{font-size:11px;fill:var(--ink-2)}
.orgsvg .dlabel{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.orgsvg .node{cursor:pointer}
.orgsvg .node:focus{outline:none}
.orgsvg .node:focus-visible .ring,.orgsvg .node:hover .ring{stroke-width:4;stroke-opacity:1}
/* Filtering and lifecycle cues affect decorative strokes, never operable text or its fill. */
.orgsvg .dim > path,.orgsvg .dim > circle{stroke-opacity:.18}
.orgsvg .node.faded > circle{stroke-opacity:.35}
.orgsvg .edge{stroke-width:1.2;opacity:.45;fill:none}
.orgsvg .acct{stroke:var(--grey);stroke-dasharray:4 4;stroke-width:1.2;fill:none;opacity:.7}
.orgsvg .edge.dim,.orgsvg .acct.dim{opacity:.18}
.orgsvg .center-lbl{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;fill:var(--muted)}
.orgside .panel{margin-block-end:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:12px;font-weight:700;border-inline-end:1px solid var(--line)}
.seg button:last-child{border-inline-end:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-on)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.chk{display:flex;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
input[type="checkbox"]{width:24px;height:24px;flex:none}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-block-start:10px}
.sysgrid .panel{border-block-start:3px solid var(--d)}
.sysgrid .chips{display:flex;flex-wrap:wrap;gap:5px;margin-block-start:6px}

/* journeys */
.jhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.jhead h2{margin:14px 0 2px;font-size:22px}
.jhead p{margin:0;color:var(--ink-2)}
.vision{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin:12px 0}
.vision .box{background:var(--chip);border-radius:4px;padding:10px 12px}
.vision .box.first{border-inline-start:4px solid var(--domain)}
.vision .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-block-end:3px}
.stages{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:8px;overflow-x:auto;padding-block-end:6px}
.stage{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;display:flex;flex-direction:column}
.stage .sh{background:var(--domain);color:var(--domain-on);border-radius:6px 6px 0 0;padding:8px 10px;font-weight:700;font-size:12.5px;display:flex;gap:8px;align-items:center}
.stage .sh .n{width:20px;height:20px;border-radius:50%;background:var(--domain);color:var(--domain-on);display:grid;place-items:center;font-size:11px;flex:none}
.stage .cell{padding:7px 10px;border-block-end:1px solid var(--line-soft);font-size:12px}
.stage .cell:last-child{border-block-end:0}
.stage .cell .k{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-block-end:2px}
.stage .cell.pain{background:var(--bad-soft)}
.stage .cell.ai{background:var(--domain-soft)}
.stage .agentlink{all:unset;cursor:pointer;font-weight:700;color:var(--ink);font-size:12px}
.stage .agentlink:hover{text-decoration:underline}
.stage .agentlink:focus-visible{outline:2px solid var(--focus)}
.personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.persona{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px}
.persona .ph{display:flex;gap:10px;align-items:center;margin-block-end:6px}
.persona .av{width:34px;height:34px;border-radius:50%;background:var(--domain-soft);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.persona .kind{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.persona .fld{font-size:12px;margin:3px 0}
.persona .fld b{color:var(--ink-2)}

/* agents canvas */
.agwrap,.agtop{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:start}
.alist{display:flex;flex-direction:column;gap:6px;position:sticky;inset-block-start:10px}
.aitem{all:unset;cursor:pointer;border:1px solid var(--line-soft);border-inline-start:4px solid var(--domain);border-radius:6px;padding:7px 10px;background:var(--panel);font-size:12.5px}
.aitem small{display:block;color:var(--muted);font-size:11px}
.aitem[aria-current="true"]{background:var(--domain-soft);border-color:var(--domain)}
.aitem:focus-visible{outline:2px solid var(--focus)}
.canvas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.canvas .c{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:9px 11px;font-size:12.5px}
.canvas .c h4{margin:0 0 5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.canvas .c.wide{grid-column:span 2}
.canvas .c.full{grid-column:1 / -1}
.canvas .c.inst{background:var(--domain-soft)}
.decl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.decl .dc{border:1px solid var(--line-soft);border-radius:6px;padding:8px 10px;font-size:12.5px;background:var(--panel)}
.decl .dc.missing{border-style:dashed;background:transparent}
.decl .dc h4{margin:0 0 4px;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.meter{height:8px;background:var(--chip-2);border-radius:999px;overflow:hidden;margin:4px 0 8px;max-width:340px}
.meter i{display:block;height:100%;background:var(--accent)}
.valbox{border:1px solid var(--line-soft);border-radius:6px;padding:10px 12px;background:var(--chip)}
.valbox .opts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.valbox label.opt{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;background:var(--panel)}
.valbox textarea,.q textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:var(--panel);resize:vertical}
details.acc{border:1px solid var(--line-soft);border-radius:6px;margin-block-end:6px;background:var(--panel)}
details.acc summary{cursor:pointer;padding:8px 12px;font-weight:700;font-size:13px;display:flex;gap:10px;align-items:center;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--grey);display:grid;place-items:center;font-size:11px;flex:none}
details.acc[open] summary{background:var(--chip);border-radius:6px 6px 0 0}
details.acc .bd{padding:8px 14px 12px}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:0}
dl.kv dt{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block-start:2px}
dl.kv dd{margin:0;font-size:12.5px}

/* architecture */
.principles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.principles .pr{background:var(--panel);border:1px solid var(--line-soft);border-inline-start:4px solid var(--accent);border-radius:6px;padding:9px 12px}
.principles .pr b{display:block;font-size:12.5px}
.principles .pr span{font-size:12px;color:var(--ink-2)}
.layers{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.layer{display:grid;grid-template-columns:230px minmax(0,1fr);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden;background:var(--panel)}
.layer .lh{background:var(--ink);color:var(--bg);padding:10px 12px}
.layer .lh b{display:block;font-size:13px}
.layer .lh span{font-size:11.5px;opacity:.85}
.layer .blks{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.blk{border:1px solid var(--line-soft);border-radius:5px;padding:6px 9px;background:var(--chip);min-width:150px;max-width:300px;flex:1 1 170px}
.blk b{display:block;font-size:12.5px}
.blk span{font-size:11.5px;color:var(--ink-2);display:block}
.blk .tags{display:flex;gap:4px;flex-wrap:wrap;margin-block-start:4px}
.blk.agent{background:var(--accent-soft);border-color:var(--accent-line)}
.blk.workflow{background:var(--warn-soft)}
.blk.control{background:var(--ok-soft)}
.flow{counter-reset:fs;display:flex;flex-direction:column;gap:5px}
.fs{display:grid;grid-template-columns:30px 110px 1fr;gap:8px;align-items:start;font-size:12.5px;background:var(--panel);border:1px solid var(--line-soft);border-radius:5px;padding:6px 8px}
.fs .no{width:24px;height:24px;border-radius:50%;background:var(--chip-2);display:grid;place-items:center;font-weight:700;font-size:11px}

/* use cases */
.ucwrap{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:16px;align-items:start}
.matrixwrap{min-width:0;max-width:100%;overflow-x:auto}
.matrix{display:block;width:100%;min-width:560px;height:auto;background:var(--panel);border:1px solid var(--line-soft);border-radius:8px}
.matrix text{font-family:var(--sans);fill:var(--ink-2)}
.matrix .q{font-size:12px;font-weight:700;fill:var(--muted);letter-spacing:.06em}
.matrix .bub{cursor:pointer}
.matrix .bub:focus{outline:none}
.matrix .bub.faded > circle{stroke-opacity:.35}
.matrix .bub:focus-visible circle,.matrix .bub:hover circle{stroke-width:4;stroke-opacity:1}

/* discovery */
.qgroup{margin-block-end:14px}
.qgroup h4{margin:0 0 6px;font-size:13px;display:flex;gap:8px;align-items:center}
.q{border:1px solid var(--line-soft);border-radius:6px;padding:9px 12px;margin-block-end:6px;background:var(--panel)}
.q .qt{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.q .qt b{font-size:13px}
.q .ans{margin:6px 0;font-size:12.5px;background:var(--chip);border-radius:4px;padding:6px 9px}
.q .row{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:center;margin-block-start:6px}
.q select{border:1px solid var(--line);border-radius:4px;padding:3px 6px;background:var(--panel)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.covbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--chip-2);max-width:420px;margin:6px 0}
.covbar i{display:block;height:100%}

/* roadmap */
.hz{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hz .col{background:var(--band);border-radius:6px;padding:10px}
.hz .col h4{margin:0 0 2px;font-size:14px}
.hz .col .rng{font-size:11.5px;color:var(--muted);margin-block-end:8px}
.hz .card{background:var(--panel);border-radius:5px;border-inline-start:4px solid var(--d);padding:7px 9px;margin-block-end:6px;font-size:12px}
.hz .card b{display:block;font-size:12px;color:var(--ink)}
.mvp{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.mvp .m{background:var(--panel);border:1px solid var(--line-soft);border-block-start:4px solid var(--d);border-radius:6px;padding:10px 12px;font-size:12.5px}
.mvp .m .op{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* evidence */
.evstats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.evstats .s{background:var(--panel);border:1px solid var(--line-soft);border-radius:6px;padding:7px 12px;font-size:12px}
.evstats .s b{font-size:18px;display:block;color:var(--accent-text)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(620px,96vw);background:var(--panel);z-index:50;box-shadow:-8px 0 24px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column}
.drawer[hidden]{display:none}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.open{transform:none}
.drawer .drawer-head{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-block-end:1px solid var(--line-soft)}
.drawer .drawer-head h2{margin:0;font-size:18px}
.drawer .drawer-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.drawer .x{all:unset;cursor:pointer;font-size:24px;line-height:1;padding:2px 8px;border-radius:4px}
.drawer .x:hover{background:var(--chip)}
.drawer .x:focus-visible{outline:2px solid var(--focus)}
.drawer .body{padding:14px 18px;overflow-y:auto;flex:1}
.rolecard{display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:start}
.avatar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff}
.pager{display:flex;justify-content:space-between;margin:26px 0 0;gap:10px}
footer.note{margin-block-start:26px;border-block-start:1px solid var(--line-soft);padding-block-start:10px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;margin:20px 0}

@media (max-width: 1100px){
  .hero,.orgwrap,.agwrap,.agtop,.ucwrap,.hybrid-grid,.row4{grid-template-columns:1fr}
  .row3{grid-template-columns:1fr}
  .row3 .arrow{display:none}
  .canvas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hz,.grid3,.grid4,.vision{grid-template-columns:1fr}
  .agents{grid-template-columns:repeat(2,minmax(0,1fr))}
  .alist{position:static}
}
@media (max-width: 700px){
  .rail{position:static;width:auto;flex-direction:row;flex-wrap:wrap;inset:auto;border:0}
  .page{padding-inline:14px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .layer{grid-template-columns:1fr}
}
@media print{
  .rail,.skip,.btnrow,.pager,.scrim,.drawer,.valbox,.filters{display:none !important}
  .page{padding-inline:0;max-width:none}
  .panel,.stage,.agent,.layer{break-inside:avoid}
}

/* agent identity kit */

.sw .chip span{font-size:12px}

.fhead span{font-size:12px}

.odark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:12px;background:#1F2A33}

.mvpsheet{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:minmax(190px,1fr) auto minmax(240px,1.3fr);gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}

@media (max-width:1050px){.mrow{grid-template-columns:1fr}}
.idpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.idt td{vertical-align:middle}

@media print{.fitem{break-inside:avoid}.mrow,.sw,.fcol{break-inside:avoid}}

.vkpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.vkpi .kl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vkpi b{font-size:18px;line-height:1.25}
.vkpi .ks{font-size:11.5px;color:var(--muted)}

.asst td{vertical-align:top}

.ucval{margin-top:12px}
code.fx{font-size:11.5px;white-space:normal;background:none;padding:0}
tr.muted td{opacity:.6}
.pill.cat-cash,.pill.cat-revenue{background:var(--ok-soft);color:var(--ok)}

.mxlegend{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.cbars{display:flex;flex-direction:column;gap:8px;margin:12px 0 6px}

.cbar .track{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--chip)}
.cbar .track span{display:block;height:100%}
.seg-credits{background:#0F6CBD}.seg-licences{background:#8764B8}.seg-azure{background:#038387}.seg-people{background:#CA5010}

.person h4{margin:0;font-size:14.5px}
.person .role{font-size:12.5px;color:var(--ink-2,var(--ink))}
.ph2{display:flex;gap:10px;align-items:center}
.av2{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-on);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}

.pill.linkp{cursor:pointer;border:none}

ul.contrib li{margin:3px 0;font-size:12.5px}
blockquote.quote{margin:0;padding:6px 10px;border-inline-start:3px solid var(--accent);font-style:italic;font-size:12.5px;color:var(--muted)}
.optchip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;background:var(--panel)}
.optchip:hover{background:var(--chip)}
.optchip:focus-visible{outline:2px solid var(--focus)}

ot Studio agent called by a Copilot Studio workflow","owner":"Head of Service Operations","channels":["Teams mobile"],"src":["E05"],"canvas":{"trigger":["Technician finishes a job and uploads voice notes or photos in Teams mobile","Work order reaches status 'Completed on site' in Field Service"],"instructions":"You are Caldova's Service Report Agent. From the technician's voice notes, photos and the work order, draft a complete service report in the customer's language: work done, parts used, readings, safety checks and follow-ups. Use only the approved report template and the work-order data. Never close a work order yourself: hand the draft to the technician for confirmation. If information is missing or contradictory, ask the technician once, then mark the field as missing.","plan":["Read the work order, asset history and the technician's notes","Transcribe and structure the voice notes into the report template","Match parts mentioned against the parts consumed from van stock","Flag missing mandatory fields and safety checks","Send the draft to the technician for confirmation in Teams","After confirmation, hand the report to the workflow for write-back","Propose a knowledge article when the fix is new"],"outcome":"A confirmed, complete service report in Field Service within minutes of the job, ready for invoicing","data_sources":["Work order and asset history (Dynamics 365 Field Service)","Voice notes and photos (Teams, OneDrive)","Report template and safety checklist (SharePoint)","Parts consumed (van stock)"],"connectors":["Dynamics 365 Field Service (declared actions, held by the workflow)","SharePoint","Teams adaptive card for confirmation","Speech to text inside the Microsoft cloud boundary"],"approval":["The technician confirms every report before write-back","The service planner approves follow-up work orders","A knowledge expert approves new articles"],"autonomy":"Act with approval: drafts and checks on its own; writes only after the technician confirms","skills":["Report structuring (template and glossary)","Parts reconciliation (script)","Multilingual drafting (DE, FR, IT, EN)"],"pattern":"Sequential: draft, rule check, human confirmation, workflow write-back","build":"Copilot Studio agent called by a Copilot Studio workflow; the Field Service connection is held by the workflow, not the agent","workflow":{"name":"Service report from voice notes","status":"draft","src":["E05"],"trigger":{"type":"connector","label":"When a work order is completed on site","system":"Dynamics 365 Field Service","detail":"Microsoft Dataverse trigger \"When a row is added, modified or deleted\" on the work order, status Completed on site"},"steps":[{"type":"variable","label":"Initialize report variables","detail":"Work order, customer language and the list of missing fields","id":"n1"},{"type":"connector","label":"Get work order and asset history","detail":"Read the work order, the asset and its service history","system":"Dynamics 365 Field Service","id":"n2"},{"type":"loop","label":"For each voice note","detail":"Voice notes the technician uploaded in Teams mobile","steps":[{"type":"connector","label":"Transcribe the voice note","detail":"Speech to text inside the Microsoft cloud boundary (service to confirm)","system":"Speech to text inside the Microsoft cloud boundary","id":"n4"}],"id":"n3"},{"type":"extract","label":"Extract readings from photos","detail":"Meter readings, serial numbers and the signed safety checklist from the technician's photos","outputs":["readings","serialNumber","safetyChecklist"],"id":"n5"},{"type":"agent","label":"Draft the service report","agent":"D3-A05","detail":"Work done, parts used, readings, safety checks and follow-ups in the customer's language, on the approved template","outputs":["reportDraft","missingFields"],"note":"The Field Service connection is held by the workflow, not by the agent","id":"n6"},{"type":"function","label":"Reconcile parts with van stock","detail":"Compare the parts in the draft dentity v1.0.0","tokens":{"po":"Factory","domain":"Ops Analyst"},"kind":"GitHub Copilot custom agent (repository)","repo":"agents/factory-ops-analyst/","colour":"#1F2A33","contrast":14.61,"glyph":"Fluent UI System Icons: data-bar-vertical (filled / regular)","status":"Hypothesis","status_class":"hypothesis","short_description":"Reads telemetry, cost and feedback and proposes backlog items.","description":"Reads telemetry, cost and feedback and proposes backlog items and autonomy changes. Process owner area: Agent Factory. Status: Hypothesis · H2."}}],"systems":["GitHub (repository, Actions, Issues)","Copilot Studio (DEV, TEST, PROD)","Power Platform pipelines","Microsoft Agent 365"],"channels":{"people":["GitHub","Visual Studio Code"],"triggered":["Pull request","Release approval"]},"kpis":[{"kpi":"Lead time","definition":"Days from an accepted use case to the agent in TEST"},{"kpi":"Evaluation pass rate","definition":"Share of golden questions that pass at release"},{"kpi":"Change failure rate","definition":"Share of releases rolled back or hot-fixed"},{"kpi":"Credits per conversation","definition":"Copilot Credits per conversation at release, against the budget"}],"approval_seam":"Agents never approve their own work: a person approves every pull request, release and autonomy change.","id":"D5","use_cases":[]}],"governance":{"items":[{"name":"Policies \u0026 standards","desc":"Delegation of authority and the AI policy define what an agent may decide alone"},{"name":"Risk classification","desc":"Purpose, autonomy level and risk tier per agent; EU AI Act where applicable"},{"name":"Data protection","desc":"Swiss revFADP and EU GDPR; customer and supplier confidentiality"},{"name":"Records \u0026 retention","desc":"What each agent run keeps, for how long, and who may see it"}]},"intelligence_resources":{"title":"Intelligence Resources","subtitle":"IT and HR jointly run Caldova's agent workforce","lifecycle":["Planned","Prototype","Pilot","Active","Upskilling","Retired"],"agent_file":["Role profile","Instructions, versioned","Seven declarations","Feedback log","Access list","KPIs"],"runs_on":[{"name":"Microsoft Agent 365","desc":"Who the agent is: registry, identity, access, policies"},{"name":"Foundry Control Plane","desc":"Tracing, evaluations and guardrails"},{"name":"Observability","desc":"Cost, quality and success rate of every run"}]},"security":[{"name":"Injection defence","desc":"An agent that reads outside text (customer requests, supplier documents, emails) never writes without approval"},{"name":"Least privilege","desc":"Each agent reaches only its own journey, region and systems"},{"name":"Conditional access","desc":"Policies apply to every agent's Microsoft Entra Agent ID"},{"name":"Audit trail","desc":"Every run records who asked, what ran and what changed"},{"name":"Data residency","desc":"Processing in Swiss or EU regions where available (to confirm per service)"}],"knowledge":[{"name":"Work IQ","desc":"Context and memory from Teams, Outlook, meetings and SharePoint","scope":"internal"},{"name":"Fabric IQ \u0026 data agents","desc":"Governed business semantics over the OneLake data products","scope":"internal"},{"name":"Business systems","desc":"Dynamics 365, SAP S/4HANA and SAP Ariba through governed connectors","scope":"internal"},{"name":"Web grounding","desc":"Fresh, cited public information: markets, suppliers, regulation","scope":"external"},{"name":"Scoped per agent","desc":"Each agent sees only the data its task needs","scope":"principle"}],"build_run":["Microsoft 365 Copilot and Copilot Cowork","Microsoft Copilot Studio (agents and workflows)","Microsoft Foundry Agent Service","Microsoft Agent Framework","Microsoft Fabric (data agents, Fabric IQ)","Power Automate"],"foundation":[{"name":"Microsoft Entra","desc":"One directory: accounts for people, Agent IDs for agents"},{"name":"Microsoft 365","desc":"The workplace people and agents share"},{"name":"Microsoft Graph","desc":"Connects people, agents and content"},{"name":"Microsoft Fabric / OneLake","desc":"One governed data estate"},{"name":"Microsoft Purview","desc":"Classification, DLP and audit for people and agents"}],"architecture":{"title":"Target architecture · Microsoft Frontier layers","intro":"One layered architecture that every journey reuses. The layer names are the Innovation Hub canon synthesised from Microsoft guidance (Cloud Adoption Framework for AI agents, Azure Architecture Center agent design patterns, Agent 365 and Microsoft IQ); the components are Microsoft's. Availability as of October 2026; verify before decisions.","src":["E07"],"principles":[{"name":"Lowest complexity that works","desc":"Start with one agent with tools; add agents only for security boundaries, separate owners or planned growth"},{"name":"The workflow owns the process, the agent owns the judgement","desc":"Deterministic steps, audit and approvals run as workflows that call agents where reasoning is needed"},{"name":"Systems of record stay authoritative","desc":"Agents read live and write only through declared, least-privilege actions; no shadow copies"},{"name":"One identity per agent","desc":"Every agent has a Microsoft Entra Agent ID, a named owner and an entry in the Agent 365 registry"},{"name":"Approval seams are designed, not prompted","desc":"Human approvals are workflow steps with state, not instructions to a model"},{"name":"Outside content is data, never instruction","desc":"Emails, documents and web text cannot change agent behaviour or trigger writes"}],"layers":[{"name":"0 · Journey \u0026 operating model","purpose":"Journeys, outcomes, human-agent ratio, decision rights","blocks":[{"name":"Four journeys","desc":"Lead-to-Order, Source-to-Pay, Request-to-Resolution, Record-to-Report"},{"name":"Agent bosses","desc":"A named owner for every agent","kind":"control"},{"name":"Intelligence Resources","desc":"IT and HR run the agent lifecycle","kind":"control"}]},{"name":"1 · Experience \u0026 channels","purpose":"Where people delegate, review and approve","blocks":[{"name":"Microsoft 365 Copilot \u0026 Cowork","desc":"Chat, delegated long-running work","status":"GA"},{"name":"Microsoft Teams \u0026 Teams mobile","desc":"Employees, technicians, approvals","status":"GA","tag":"MVP"},{"name":"Outlook","desc":"Customers and suppliers","status":"GA"},{"name":"Customer and supplier portals","desc":"Existing","kind":"system"}]},{"name":"2 · Orchestration \u0026 agents","purpose":"Lead agents coordinating specialist agents and deterministic workflows","blocks":[{"name":"Lead agents","desc":"Copilot Studio multi-agent orchestration","status":"GA","kind":"agent"},{"name":"Specialist agents","desc":"Copilot Studio or Foundry Agent Service","kind":"agent","tag":"MVP"},{"name":"Microsoft Agent Framework","desc":"Pro-code agents and workflows","status":"GA"},{"name":"Workflows \u0026 approvals","desc":"Copilot Studio workflows, Power Automate","kind":"workflow","tag":"MVP"}]},{"name":"3 · Knowledge \u0026 context (IQ)","purpose":"Permission-aware grounding and memory","blocks":[{"name":"Work IQ","desc":"Work context from Microsoft 365","status":"GA"},{"name":"Fabric IQ \u0026 Fabric data agents","desc":"Governed business semantics over OneLake","status":"GA"},{"name":"Foundry IQ / Azure AI Search","desc":"Shared knowledge bases: manuals, cases","status":"GA and preview"},{"name":"Web grounding","desc":"Cited public information","status":"To confirm"}]},{"name":"4 · Tools \u0026 actions","purpose":"Read and write systems of record","blocks":[{"name":"Power Platform connectors","desc":"Dynamics 365, SAP, SharePoint, Teams","tag":"MVP"},{"name":"MCP servers \u0026 A2A","desc":"Approved tool and agent protocols"},{"name":"Governed access layer","desc":"Declared write actions, read-before-write","kind":"control","tag":"MVP"},{"name":"SAP S/4HANA, SAP Ariba, Dynamics 365","desc":"Systems of record (existing)","kind":"system"}]},{"name":"5 · Models","purpose":"Reasoning matched to the task","blocks":[{"name":"Model choice per agent","desc":"Copilot Studio and Foundry model catalog"},{"name":"Model router","desc":"Right-size cost and quality (Foundry)"}]},{"name":"6 · Identity, security \u0026 governance","purpose":"Every agent identifiable, governed and protected","blocks":[{"name":"Microsoft Entra Agent ID","desc":"An identity per agent, Conditional Access","status":"GA","kind":"control"},{"name":"Microsoft Agent 365","desc":"Registry and control plane","status":"GA","kind":"control"},{"name":"Microsoft Purview","desc":"DLP, audit, data security for AI","kind":"control"},{"name":"Microsoft Defender","desc":"Threat protection for AI and agents","kind":"control"},{"name":"Environments \u0026 DLP policies","desc":"Dev, test, prod; connector groups","kind":"control","tag":"MVP"}]},{"name":"7 · Observability, evaluation \u0026 operations","purpose":"Quality, safety, cost and value","blocks":[{"name":"Foundry Control Plane","desc":"Tracing, evaluations, guardrails","status":"GA and preview","kind":"control"},{"name":"Copilot Studio analytics \u0026 evaluations","desc":"Test sets and run health","kind":"control"},{"name":"Azure Monitor / Application Insights","desc":"Operational telemetry"},{"name":"Copilot Credits \u0026 cost alerts","desc":"Consumption per agent and workflow"}]},{"name":"✚ · Approval seams","purpose":"Human checkpoints between agent steps (cross-cutting)","blocks":[{"name":"Request information step","desc":"Copilot Studio workflows","kind":"workflow","tag":"MVP"},{"name":"Tool approval","desc":"Microsoft Agent Framework","kind":"workflow"},{"name":"Teams approvals","desc":"Adaptive cards with recorded decisions","kind":"workflow"},{"name":"Cowork checkpoints","desc":"Approvals in delegated work","kind":"workflow"}]}],"flows":[{"name":"MVP flow · Voice-to-service report","note":"Workflow-first: the agent is called at two reasoning steps; every write happens after a person confirms.","src":["E05"],"steps":[{"actor":"human","text":"The technician records voice notes and photos in Teams mobile after the job"},{"actor":"workflow","text":"The workflow starts on upload and creates the run record"},{"actor":"agent","text":"The Service Report Agent drafts the report: work done, parts used, readings, follow-ups"},{"actor":"workflow","text":"Rule checks: mandatory fields, parts against stock movement, safety checklist"},{"actor":"human","text":"The technician reviews and confirms the draft in Teams (approval seam)"},{"actor":"workflow","text":"The workflow writes the confirmed report to Field Service through declared actions"},{"actor":"system","text":"The work order is closed and billing starts in SAP"},{"actor":"agent","text":"A new fix is proposed as a knowledge article for an expert to approve"}]}],"patterns":[{"pattern":"Handoff","where":"Lead agents routing a case to specialists (Service Lead to Diagnostics to Dispatch)","why":"The right specialist only emerges while the case is processed"},{"pattern":"Sequential","where":"Service report: draft, rule check, confirmation, write-back","why":"Linear, auditable steps with a human gate"},{"pattern":"Concurrent","where":"Account brief: CRM, ERP, service history and web research in parallel","why":"Independent sources; latency matters"},{"pattern":"Group chat (maker-checker)","where":"Quote Builder drafts, Deal Desk checks deviations","why":"Structured review before the approval seam"}],"decisions":[{"id":"ADR-01","title":"Copilot Studio as the primary build platform","decision":"Low-code agents and workflows in Copilot Studio; Foundry for pro-code agents and custom retrieval","status":"proposed","rationale":"Speed and governance inside the Microsoft 365 boundary; follows the Cloud Adoption Framework build-choice guidance"},{"id":"ADR-02","title":"Workflow-first","decision":"Every process runs as a deterministic workflow that calls agents at reasoning steps","status":"proposed","rationale":"The audit trail and approvals must not depend on model behaviour"},{"id":"ADR-03","title":"Systems of record stay authoritative","decision":"No agent-side copies of master data; live reads, declared writes","status":"proposed","rationale":"Prevents drift and shadow databases","areas":["E"]},{"id":"ADR-F01","title":"Build every agent through the Agent Factory","status":"proposed","context":"Agents built by clicking in one environment cannot be reviewed, reproduced or promoted safely.","decision":"Agents are specified, built, evaluated and released as code through pull requests with human approval; the GitHub Copilot harness where it fits.","consequences":"Needs a repository, a pipeline and builder licences (IT readiness); every agent follows one quality bar.","alternatives":"Build per environment in the maker portal; export and import solutions by hand.","areas":["I"],"canon":true},{"id":"ADR-F02","title":"Read-only first; writes only after a separate gate","status":"proposed","context":"Writes into systems of record carry the highest risk.","decision":"MVP agents read and draft; every write goes through a declared action held by a workflow and a person's confirmation, opened after its own review.","consequences":"Value starts with drafting and advice; automation grows with evidence.","alternatives":"Writes from day one with approval prompts only.","areas":["E","D4"],"canon":true},{"id":"ADR-F04","title":"One landing-zone pattern for every agent","status":"proposed","context":"Agents appear in default environments without rules.","decision":"A managed environment per journey and stage inside environment groups, with data policies, identities and budgets from one template.","consequences":"Environments are created on purpose; every journey starts compliant.","alternatives":"One shared environment per stage for all journeys.","areas":["C","F"],"canon":true},{"id":"ADR-F05","title":"Aggregated signals only","status":"proposed","context":"Agent telemetry can expose individuals.","decision":"Quality, value and cost are measured per agent, process or team, never per employee.","consequences":"Works-council and data-protection alignment is simpler; no individual performance views.","alternatives":"Per-user analytics.","areas":["D3"],"canon":true},{"id":"ADR-F06","title":"Evaluation is the definition of done","status":"proposed","context":"Without evaluations, quality is a feeling and regressions go unnoticed.","decision":"No build task without a failing evaluation case; releases gate on agreed thresholds (evaluation pyramid L0 to L5).","consequences":"Evaluation sets are part of the handover package; thresholds are agreed with the business owner.","alternatives":"Manual testing before release.","areas":["I"],"canon":true},{"id":"ADR-F07","title":"Pay-as-you-go until a usage baseline","status":"proposed","context":"Pre-purchase commitments cannot be refunded.","decision":"Copilot Credits on pay-as-you-go with budgets and alerts; capacity packs or pre-purchase only after three months of measured usage.","consequences":"Slightly higher unit price at the start; no stranded commitment.","alternatives":"Capacity packs or a pre-purchase plan from day one.","areas":["A"],"canon":true}],"open_decisions":[{"id":"TD-01","question":"Data residency per service for Swiss data (Copilot Studio, Foundry, Fabric)","owner":"Caldova IT with Microsoft"},{"id":"TD-02","question":"Access path to SAP S/4HANA: connector, integration platform or MCP server","owner":"Caldova IT"},{"id":"TD-03","question":"Licensing: Microsoft 365 E7 or Agent 365 plus Copilot Credits per agent","owner":"Caldova Procurement and IT"}],"sources":["Microsoft Work Trend Index 2025: The year the Frontier Firm is born","Cloud Adoption Framework: AI agents (plan, govern and secure, build, manage)","Azure Architecture Center: AI agent orchestration patterns","Microsoft Learn: Microsoft Entra Agent ID; Microsoft Agent 365; Microsoft IQ","Microsoft Learn: Copilot Studio workflows and the request-information step"],"landing_zone":{"title":"Agent landing zone: one pattern for every agent","intro":"Every agent lives in the same landing zone: shared platform services and guardrails, and one landing zone per journey with DEV, TEST and PROD. Select an area for its details, or a principle to see where it applies.","caption":"Letters follow the Cloud Adoption Framework design areas. Icons in the journey zones are the agents' identity icons.","principles":{"waf":{"short":"WAF","name":"Well-Architected (Azure and Power Platform)","items":[["rel","Reliability","Agents degrade gracefully; workflows retry and hand over to people"],["sec","Security","Least privilege, no secrets, data policies and threat protection"],["cost","Cost Optimization","Credits and Azure spend budgeted, measured and allocated per agent"],["ops","Operational Excellence","Everything as code, automated deployment, observability"],["perf","Performance Efficiency","Fast answers within capacity and quotas"],["exp","Experience Optimization","Agents meet people where they work, accessible and consistent"]]},"caf":{"short":"CAF","name":"Cloud Adoption Framework for AI agents","items":[["plan","Plan for agents","Use cases, skills and data readiness before the build"],["govern","Govern and secure agents","Policies, identities, data protection and Responsible AI"],["build","Build agents","Standard build paths, reusable components, the Agent Factory"],["manage","Manage agents","Registry, lifecycle, monitoring and cost"]]},"rai":{"short":"RAI","name":"Responsible AI","items":[["fair","Fairness","No agent decides about people; outcomes checked for bias"],["safe","Reliability and safety","Evaluations, red teaming and human approval for actions"],["priv","Privacy and security","Data minimisation, data classes per stage, no individual tracking"],["incl","Inclusiveness","Accessible to every employee, in their languages"],["transp","Transparency","People know they talk to an agent and see its sources"],["acc","Accountability","Every agent has a human owner who answers for it"]]}},"classes o with documents and existing data"},{"h":"H2","label":"Next (6–18 months)","meaning":"Lead agents orchestrating specialists, integrated with Dynamics 365, SAP and Fabric data products"},{"h":"H3","label":"Later (18+ months)","meaning":"Agent-operated journeys with bounded autonomy and exceptions to people"}],"mvp_options":[{"option":"A","use_case":"Voice-to-service report (Service Report Agent)","domain":"D3","why":"Highest daily pain for about 900 technicians; a narrow, reversible write after the technician confirms; fast to prototype with Teams mobile and Field Service","needs":"20 anonymised service reports, the work-order field list, a technician panel, a Field Service sandbox","src":["E05"]},{"option":"B","use_case":"Guided buying and intake (Guided Buying Agent)","domain":"D2","why":"Every employee touches it; routes demand to negotiated channels; proves the front-door pattern for other journeys","needs":"Channel matrix, catalogue and frame-contract list, Ariba requisition API, a pilot plant","src":["E06"]}],"next_steps":[{"step":"Validate the four journeys and the MVP shortlist in the envisioning workshop","owner":"Caldova leadership team, Microsoft","when":"12 Nov 2026","status":"Next"},{"step":"Share the work-order field list and 20 anonymised service reports under NDA","owner":"Caldova Service Operations","when":"by 19 Nov 2026","status":"Planned"},{"step":"Architecture session with Caldova IT: identity, data residency, SAP access","owner":"Microsoft Innovation Hub, Caldova IT","when":"by 26 Nov 2026","status":"Planned"},{"step":"PRD and solution design for both MVP candidates","owner":"Microsoft Innovation Hub","when":"one week after the workshop","status":"Planned"},{"step":"Rapid prototype of the Service Report Agent in Copilot Studio","owner":"Microsoft Innovation Hub","when":"December 2026","status":"Planned"}],"evidence":[{"id":"E01","type":"transcript","title":"Discovery call with the CIO and the Head of Digital","date":"2026-09-29","source":"Teams  with evaluations and security review, approved by a person","icons":["ghcopilot","vscode","copilotstudio"]},{"id":"release","name":"Released","what":"Promoted to TEST and PROD with approvals","gate":"Release approver","icons":["github","copilotstudio"]},{"id":"operate","name":"Operate \u0026 learn","what":"Observed, measured and improved; autonomy grows with evidence","gate":"The business owner promotes autonomy","icons":["agent365","entra","purview"]}],"handover":[["validated","Validated in the workshop"],["canvas","Trigger canvas complete"],["declarations","Seven declarations made"],["identity","Identity: display names and icons"],["value","Business value validated (gate V2)"],["cost","Cost envelope modelled (gate F1)"],["readiness","IT readiness for the build stage"],["owner","Agent boss named"]],"steps":[{"id":"1","name":"Idea \u0026 intake","loop":"plan","what":"A business team brings an idea as a use-case card: problem, value, feasibility and the agent it needs. The product owner accepts it into the backlog, or parks it.","agent":"Spec Architect Agent","tools":[["github","GitHub Issues and Projects: one issue per use case"],["m365copilot","Microsoft 365 Copilot: the business team writes and refines the card"]],"gate":"The product owner accepts the use case (value and feasibility rated)","evidence":"Use-case card in the backlog with value, feasibility and owner","superpowers":["brainstorming"],"cat":["AI Use Case Assessment"],"customer":"Business teams bring ideas as use-case cards; IT supervises and publishes (fictitious)."},{"id":"2","name":"Design","loop":"plan","what":"Canvas, seven declarations, Responsible AI impact and the build choice: Agent Builder, Copilot Studio or Microsoft Foundry, and in Copilot Studio the Standard or the GitHub Copilot harness. Every behaviour goes into the smallest component that makes it reliable and inspectable.","agent":"Spec Architect Agent","tools":[["agentbuilder","Agent Builder when knowledge and instructions are enough" t"},{"id":"FR-0003","text":"Every agent has a declared refusal set and records each refusal with its reason.","priority":"Must","verify":"Refusal test suite"},{"id":"FR-0004","text":"Every agent has a named escalation path to a human owner, reachable in Teams.","priority":"Must","verify":"Escalation test"},{"id":"FR-0005","text":"No agent makes or communicates a decision about a person (hiring, pay, performance, promotion, exit); agents prepare, people decide.","priority":"Must","verify":"Behaviour review at design and release"},{"id":"FR-0006","text":"Every process is implemented workflow-first; an agent is invoked only at steps that need reasoning a rule cannot express.","priority":"Must","verify":"Design review"},{"id":"FR-0007","text":"The audit record is written by deterministic workflow steps, never left to the agent's discretion.","priority":"Must","verify":"Audit export review; forced-failure test"},{"id":"FR-0008","text":"Every run surfaces its outcome, including everything it could not complete, to a named human owner. Silent partial success is a defect.","priority":"Must","verify":"Run-completion review"},{"id":"FR-0009","text":"Writes to systems of record pass through declared actions that enforce read-before-write, an allow-list and idempotency server-side.","priority":"Must","verify":"Negative test: out-of-envelope call is rejected"},{"id":"FR-0010","text":"Content from outside the platform (emails, documents, web pages, supplier or customer text) is treated as data, never as instruction.","priority":"Must","verify":"Prompt-injection test set"}],"agents":[{"agent":"D2-A01","name":"Guided Buying Agent","journey":"D2","journey_name":"Procurement","capability":"Front door for every purchase need: asks the right questions, checks catalogues and frame contracts, prepares the requisition","requirements":[{"id":"FR-0011","kind":"trigger","text":"The agent run starts when: Employee describes a need in Teams or Microsoft 365 Copilot","priority":"Must","verify": scoped (Microsoft Entra Agent ID)."},{"id":"NFR-0002","category":"Security","text":"No long-lived secret where workload identity federation is available; unavoidable secrets live in Azure Key Vault with rotation."},{"id":"NFR-0003","category":"Security","text":"Conditional Access and Agent 365 policies apply to every agent identity; every agent is registered with an owner."},{"id":"NFR-0004","category":"Privacy","text":"No personal data in prompts, logs or telemetry beyond the references needed to act; retention is defined per artefact class."},{"id":"NFR-0005","category":"Privacy","text":"Processing and storage respect the customer's data residency requirements (Swiss / EU regions where available) and revFADP / GDPR."},{"id":"NFR-0006","category":"Governance","text":"A DLP policy covering the full connector inventory is applied to every environment before the first artefact is built."},{"id":"NFR-0007","category":"Governance","text":"Each agent carries a risk tier, an autonomy level and the seven declarations; release requires a named human approval."},{"id":"NFR-0008","category":"Reliability","text":"Integration calls retry with backoff inside the workflow or access layer, not in agent logic; writes are idempotent under retry."},{"id":"NFR-0009","category":"Operability","text":"Run status, outcome distribution, exception rate, evaluation scores and Copilot Credit consumption are observable without reading logs."},{"id":"NFR-0010","category":"Maintainability","text":"No environment-specific value is hard-coded; promotion uses managed solutions through a pipeline (DEV, TEST, PROD)."},{"id":"NFR-0011","category":"Availability","text":"Capacity and consumption are monitored and alerted in every environment so that runs are never blocked silently."},{"id":"NFR-0012","category":"Cost","text":"Reasoning is invoked only where needed; deterministic steps handle well-formed inputs; evaluation is budgeted as recurring spend."}],"acceptance":[{"id":"AC-001","agent":"D2-A01","agent_name":"Guided Buying Agent","text":"The agent refuses and records the reason when Stops for restricted categories, amounts above the self-service limit or unknown cost centres; records why."},{"id":"AC-002","agent":"D2-A01","agent_name":"Guided Buying Agent","text":"The agent never writes outside its envelope: Creates requisitions in SAP Ariba through one declared action after the requester confirms. No purchase orders, no supplier master changes."},{"id":"AC-003","agent":"D2-A01","agent_name":"Guided Buying Agent","text":"The agent is measured by Share of needs routed to negotiated channels; requisition cycle time; maverick buying rate; requester satisfaction."},{"id":"AC-004","agent":"D3-A05","agent_name":"Service Report Agent","text":"The agent refuses and records the reason when Stops when the work order cannot be matched, when safety checks are missing, or when notes contradict the parts consumed; records the reason."},{"id":"AC-005","agent":"D3-A05","agent_name":"Service Report Agent","text":"The agent never writes outside its envelope: After the technician confirms, the workflow updates report fields and work-order status in Field Service. Never edits prices, contracts or customer master data."},{"id":"AC-006","agent":"D3-A05","agent_name":"Service Report Agent","text":"The agent is measured by Minutes from job end to confirmed report; share of reports without correction; second-visit rate; technician satisfaction."}],"kpis":[{"kpi":"Spend under management","journey":"D2","journey_name":"Procurement","definition":"Share of spend through negotiated channels","baseline":"about 70% (estimate)","target":"\u003e 90%"},{"kpi":"Maverick buying rate","journey":"D2","journey_name":"Procurement","definition":"Share of indirect spend outside catalogues and contracts","baseline":"about 25%","target":"\u003c 10%"},{"kpi":"Requisition cycle time","journey":"D2","journey_name":"Procurement","definition":"Hours from need to approved requisition","baseline":null,"target":"\u003c 4 hours"},{"kpi":"Tail spend negotiated","journey":"D2","journey_name":"Procurement","definition":"Share of tail spend under negotiated terms","baseline":null,"target":null},{"kpi":"Second-visit rate","journey":"D3","journey_name":"Service","definition":"Share of cases needing more than one visit","baseline":"about 12%","target":"\u003c 7%"},{"kpi":"Time to confirmed report","journey":"D3","journey_name":"Service","definition":"Minutes from job end to confirmed report","baseline":"next day (typical)","target":"\u003c 15 minutes"},{"kpi":"Invoice lead time","journey":"D3","journey_name":"Service","definition":"Days from job end to invoice","baseline":null,"target":null},{"kpi":"First-time fix rate","journey":"D3","journey_name":"Service","definition":"Share of cases fixed on the first visit","baseline":null,"target":null}],"roles":[["Guided Buying Agent","Head of Operational Procurement","Agent boss: owns mandate, instructions and KPIs"],["Service Report Agent","Head of Service Operations","Agent boss: owns mandate, instructions and KPIs"],["Platform","Customer IT / platform owner","Environments, identities, DLP, ALM"],["Agent lifecycle","Intelligence Resources (IT + HR)","Registry, onboarding, upskilling, retirement"],["Security and privacy","CISO / DPO","Risk tier, data protection, release approval"]],"dependencies":["Channel matrix","Ariba requisition API","Field Service write actions","Report template","20 anonymised service reports, the work-order field list, a technician panel, a Field Service sandbox","Channel matrix, catalogue and frame-contract list, Ariba requisition API, a pilot plant"],"risks":[{"id":"R-UC09-1","title":"Works-council approval for voice processing","score":20,"mitigation":"Brief the works council before the pilot; aggregated telemetry only; the technician confirms every report"},{"id":"R-C03","title":"Data in the systems of record is incomplete, or access is not approved in time","score":16,"mitigation":"Read-only first; test access or synthetic data for the prototype (IT readiness P-27); test data under NDA before the build"},{"id":"R-C01","title":"Over-automation: agents placed where a rule or a person should decide","score":12,"mitigation":"Workflow-first design review; autonomy one level lower at the start; a named person approves at every seam"},{"id":"R-C02","title":"Prompt injection through mail, documents, supplier or web content","score":12,"mitigation":"Outside content is data, never instruction; declared write actions with an allow-list; a prompt-injection test set in the evaluation pyramid"},{"id":"R-ONT-2","title":"Data agents and operations agents don't work with an ontology bound to semantic models (known issue)","score":12,"mitigation":"Bind the entity types that agents use to lakehouse, warehouse or eventhouse tables; reuse semantic-model measures as metrics; re-check the known issue"},{"id":"R-ONT-3","title":"Keys and master data are not clean enough to relate the entity instances across systems","score":12,"mitigation":"Profile the key columns before binding; agree one key per entity type with its data owner; map cross-system keys in the curated layer"},{"id":"R-UC05-1","title":"Ariba requisition API access in TEST","score":12,"mitigation":"The employee confirms the requisition; approvals stay in SAP Ariba."},{"id":"R-UC09-3","title":"Field Service write actions need a security review","score":12,"mitigation":"The technician confirms every report; no write without confirmation; aggregated telemetry only."},{"id":"R-01","title":"The seasonal service peak (November to February) limits technician time for the pilot","score":9,"mitigation":"Pilot with a technician panel of eight in one region; start after the peak planning in January"},{"id":"R-C04","title":"People keep their old way of working and bypass the agents","score":9,"mitigation":"An agent boss and champions per journey; measured outcomes in the digital feedback loop; training before go-live"},{"id":"R-UC09-2","title":"Speech quality on noisy sites","score":9,"mitigation":"The technician confirms every report; no write without confirmation; aggregated telemetry only."},{"id":"R-C06","title":"Agents built outside the Agent Factory without owner, identity or registry entry","score":8,"mitigation":"Microsoft Agent 365 registry and the agent identity kit; Definition of Ready before build; DLP policies in every environment"},{"id":"R-C05","title":"Copilot Credit consumption above the plan","score":6,"mitigation":"Budgets and alerts per environment; pay-as-you-go until a usage baseline exists; monthly plan versus actual; pay-as-you-go agreed for the pilot (FinOps page)"},{"id":"R-C07","title":"Preview capabilities change or are withdrawn","score":6,"mitigation":"Dated availability with its source; every preview item has an owner and a fallback; verify before decisions"},{"id":"R-UC05-2","title":"Channel matrix kept current","score":6,"mitigation":"The employee confirms the requisition; approvals stay in SAP Ariba."},{"id":null,"title":"Works council approval","score":null,"mitigation":"[To complete]"},{"id":null,"title":"Speech quality on site","score":null,"mitigation":"[To complete]"}],"decisions":[{"id":"D-01","question":"What share of indirect spend bypasses catalogues and frame contracts? (Procurement · Business \u0026 process)","ref":"D2-Q01","owner":"[To complete]"},{"id":"D-02","question":"Which channel matrix exists today, and who maintains it? (Procurement · Business \u0026 process)","ref":"D2-Q02","owner":"[To complete]"},{"id":"D-03","question":"Are catalogues and frame contracts searchable with prices and validity dates? (Procurement · Data)","ref":"D2-Q03","owner":"[To complete]"},{"id":"D-04","question":"Can requisitions be created in Ariba through an API with a service identity? (Procurement · Systems \u0026 integration)","ref":"D2-Q04","owner":"[To complete]"},{"id":"D-05","question":"What are the self-service limits per role in the delegation of authority? (Procure
